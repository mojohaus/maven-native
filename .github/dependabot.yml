version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    exclude-paths:
      - "native-maven-plugin/src/it/**"
      - "native-maven-plugin/src/it-repo/**"
      - "native-maven-plugin/src/test/resources/**"
    schedule:
      interval: "monthly"
    groups:
      maven:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Stay on the Maven 3.9.x line; 3.10 is not the plugin baseline yet
      - dependency-name: "org.apache.maven:maven-artifact"
        versions: [">= 3.10.0"]
      - dependency-name: "org.apache.maven:maven-compat"
        versions: [">= 3.10.0"]
      - dependency-name: "org.apache.maven:maven-core"
        versions: [">= 3.10.0"]
      - dependency-name: "org.apache.maven:maven-model"
        versions: [">= 3.10.0"]
      - dependency-name: "org.apache.maven:maven-plugin-api"
        versions: [">= 3.10.0"]
      # Checkstyle >=10 requires Java 11+
      - dependency-name: "com.puppycrawl.tools:checkstyle"
        versions: [">= 10.0"]
      # plexus-xml 4.x depends on the Maven 4 XML API
      - dependency-name: "org.codehaus.plexus:plexus-xml"
        versions: [">= 4.0.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
